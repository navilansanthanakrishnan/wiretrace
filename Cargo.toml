[package]
name = "agent-mcp-b"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
brotli = "8.0.2"
clap = { version = "4.5.51", features = ["derive", "env"] }
directories = "6.0.0"
flate2 = "1.1.5"
hudsucker = { version = "0.24.0", features = ["http2", "openssl-ca"] }
http-body-util = "0.1.3"
rcgen = { version = "0.14.7", features = ["aws_lc_rs", "crypto", "pem", "x509-parser"] }
rdev = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
