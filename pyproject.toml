[project]
name = "wiretrace"
version = "0.1.0"
description = "Watch an app, learn its API, hand it to an agent."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "mcp>=2,<3"]

[project.scripts]
wiretrace = "wiretrace.cli:main"
wiretrace-mcp = "wiretrace.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wiretrace"]
